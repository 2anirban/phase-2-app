name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check code quality
        run: python -m ruff check app tests

      - name: Check formatting
        run: python -m ruff format --check app tests

      - name: Run tests and check coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Build Docker image
        run: docker build -t fde-api:ci .
